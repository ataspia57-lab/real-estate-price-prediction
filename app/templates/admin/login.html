<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in · PropValue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%232f6f62'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
  <form class="card login" method="post">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">◆</span> PropValue <small>Admin</small></a>
    <h1>Sign in</h1>
    <p class="muted">Admin area for the Real Estate Price Prediction System.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button class="primary" type="submit">Sign in</button>
    {% if default_password %}
      <p class="note">Demo password: <code>admin123</code>. Set <code>ADMIN_PASSWORD</code> before deploying.</p>
    {% endif %}
  </form>
</body>
</html>
